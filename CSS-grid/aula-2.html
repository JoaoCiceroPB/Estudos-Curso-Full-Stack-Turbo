<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 20px;
            height: calc(100% - 40px);
            background-color: burlywood;
            display: grid;

            grid-template-columns:
                [inicio] 1fr [metade-1 meio-1] 1fr [metade-2 meio-2] 1fr [fim];
            grid-template-rows: repeat(3, 1fr);
            column-gap: 20px;
            row-gap: 5px;

            /* shorthand */
            gap: 5px 30px;
        }

        div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: solid 3px darkcyan;
            background: #fff;
        }

        .box1 {
            grid-column-start: meio-2;
            grid-column-end: fim;

            /* shorthand */
            grid-column: meio-1 / fim;
            grid-row: 1 / span 2;

            grid-area: 1 / meio-1 / span 3 / fim;
        }
    </style>
    <title>CSS - Grid Layout Parte 2</title>
</head>

<body>
    <div class="box1">01</div>
    <div class="box2">02</div>
    <div class="box3">03</div>
</body>

</html>
