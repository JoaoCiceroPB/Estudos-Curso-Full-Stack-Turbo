<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout de Galeria com Destaque</title>
    <style>
        div{
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }
        div.container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            grid-template-columns: [inicio] 1fr [meio-1] 1fr [meio-2] 1fr
            [fim];
        }

        .item1 {
            grid-column: inicio / fim;
            grid-column: 1 / span 2;
            grid-row: 1 / span 2;
        }
    </style>
</head>
<body>
    <!--    Crie uma estrutura HTML simples contendo um container e 6 itens internos (<div class="item">1</div>, <div class="item">2</div>, etc.) e aplique o CSS -->

    <div class="container">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
    </div>

</body>
</html>
